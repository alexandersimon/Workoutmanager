spring.application.name=Workoutmanager

springdoc.api-docs.path=/api-docs
spring.config.import=classpath:application-springdoc.yaml

spring.datasource.url=jdbc:h2:mem:testdb;NON_KEYWORDS=USER

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Flyway verwaltet das Schema
#spring.flyway.enabled=true
#spring.flyway.locations=classpath:db/migration

# Hibernate prüft das Mapping, verändert aber keine Tabellen
#spring.jpa.hibernate.ddl-auto=validate

# Keine zusätzliche Initialisierung über schema.sql / data.sql
#spring.sql.init.mode=never
#spring.jpa.defer-datasource-initialization=false

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.data.jpa.repositories.bootstrap-mode=default
spring.jpa.defer-datasource-initialization=true